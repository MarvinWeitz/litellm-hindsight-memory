[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-hindsight-memory"
version = "0.1.0"
description = "LiteLLM proxy plugin that routes requests through Hindsight memory banks by customer and project tags"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm[proxy]>=1.106,<2",
    "hindsight-client>=1.1,<2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_hindsight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
