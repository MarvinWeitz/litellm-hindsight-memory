name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' -e './promotion[dev]'
      - run: pytest -q
      - name: promotion tests
        run: pytest -q
        working-directory: promotion
