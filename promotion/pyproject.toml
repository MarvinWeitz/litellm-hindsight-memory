[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hindsight-promotion"
version = "0.1.0"
description = "Reviewed promotion of reusable SAP knowledge from customer Hindsight banks into the global bank"
requires-python = ">=3.11"
dependencies = [
    "hindsight-client>=1.1,<2",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight_promotion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
