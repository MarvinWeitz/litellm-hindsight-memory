# Which Hindsight banks a request reads and writes, decided only by request tags.
# Tags arrive as the x-litellm-tags header, a top-level "tags" array, or metadata.tags.
#
# The plugin has no built-in defaults: every key below is required. Keys that can be
# switched off take an explicit null. Unknown keys are refused at load time.
hindsight_routing:
  hindsight:
    url_env: HINDSIGHT_API_URL          # environment variable holding the Hindsight API URL
    api_key_env: HINDSIGHT_API_KEY      # environment variable holding the API key; null = no key
    client_timeout_seconds: 30          # HTTP timeout of the client (recall has its own below)
    user_agent: litellm-hindsight-memory

  tags:
    # Bank tag: picks the memory bank. At most one per request.
    # The name is the placeholder in templates below: {customer}.
    bank:
      name: customer
      prefix: "customer:"
    # Scope tag: narrows recall and retain inside the chosen bank, never picks a bank.
    # Placeholder {project}. Set the whole scope to null for banks without scopes.
    scope:
      name: project
      prefix: "project:"
      when_missing: "_shared"           # value used when a request has no scope tag; null = none
    opt_out: "memory:off"               # add this tag to skip memory for one request; null = no opt-out
    passthrough: ["domain:", "kind:"]   # request tags copied onto saved memories
    slug_pattern: "^[a-z0-9_][a-z0-9_-]{0,62}$"   # every bank and scope value must match
    lowercase: true                     # match prefixes and values ignoring case, store lowercase

  banks:
    write: "customer::{customer}"       # the only bank the proxy ever writes
    read:                               # all recalled in parallel
      - bank: "customer::{customer}"
        tags: ["project:{project}", "project:_shared"]
        tags_match: any_strict          # untagged memories never leak in
        types: [world, experience]      # skip observations: they merge facts across projects
        budget: low
        max_tokens: 1500
      # Shared layers go under global_banks below.

  # Shared banks on top of the bank picked by the bank tag. The proxy only reads them;
  # the promotion job (promotion/) is what writes reviewed knowledge into them.
  # Create or update them with: python -m litellm_hindsight.provision
  # [] = no global banks.
  global_banks:
    - id: "global::sap"
      name: "SAP CAP/BTP knowledge"     # display name in Hindsight; null = the id
      # Which routed requests read this bank: "all", or a mapping whose keys follow the
      # tag names above: customer, exclude_customer, project, exclude_project, plus
      # request_tags (the request must carry one of them). Listed conditions must all hold.
      applies_to: all
      recall:
        tags: []                        # [] = no tag filter
        tags_match: any
        types: []                       # [] = all memory types
        budget: low
        max_tokens: 1000
      profile:                          # sent to Hindsight by the provision command
        retain_mission: >-
          Extract reusable SAP CAP/BTP knowledge: patterns, configuration recipes, version-specific
          pitfalls, error messages with root causes. Ignore anything customer-specific.
        observations_mission: >-
          Consolidate patterns confirmed across several sources. Flag guidance that contradicts
          newer SAP releases. Write in English.
        reflect_mission: >-
          You are an SAP CAP/BTP architect. Give generic, version-aware guidance
          and say when it depends on the landscape.
        disposition: {skepticism: 4, literalism: 4, empathy: 1}
        config:                         # any Hindsight bank config key, passed through as is
          retain_custom_instructions: "Write every fact and observation in English, whatever language the source text uses."
          entity_labels:
            - key: domain
              type: multi-values
              tag: true
              values:
                - {value: cap, description: "SAP Cloud Application Programming Model: CDS, services, handlers"}
                - {value: xsuaa, description: "Authentication, roles, XSUAA / IAS"}
                - {value: destinations, description: "BTP destinations and Connectivity / Cloud Connector"}
                - {value: hana-cloud, description: "HANA Cloud, HDI containers, persistence"}
                - {value: event-mesh, description: "Eventing, Event Mesh, messaging"}
                - {value: s4-integration, description: "S/4HANA APIs, OData, side-by-side extensions"}
            - key: kind
              type: value
              tag: true
              values:
                - {value: decision, description: "A choice made and why"}
                - {value: pitfall, description: "An error, gotcha or failed approach and its fix"}
                - {value: pattern, description: "A reusable implementation approach"}
                - {value: runbook, description: "Step-by-step operational procedure"}

    # A layer for some customers only:
    # - id: "industry::utilities"
    #   name: null
    #   applies_to: {customer: [globex]}
    #   recall: {tags: [], tags_match: any, types: [], budget: low, max_tokens: 800}
    #   profile:
    #     retain_mission: "Extract reusable knowledge about SAP IS-U and utilities processes."
    #
    # A layer a request opts into with a tag:
    # - id: "global::abap"
    #   applies_to: {request_tags: ["stack:abap"]}
    #   ...

  retain:
    enabled: true
    tags: ["project:{project}", "source:litellm-proxy"]
    max_chars: 12000
    template: "Developer: {user}\n\nAssistant: {assistant}"
    context: >-
      Developer conversation through the LiteLLM proxy. The assistant was given memory recalled
      from this bank, so its answer may repeat known facts: extract only what is new here.
    document_prefix: "turn:"            # document id = prefix + hash of bank, scope and message
    metadata: {source: litellm-proxy}   # the model name is always added

  recall:
    timeout_seconds: 0.8         # fail open: no memory rather than a slow request
    cache_ttl_seconds: 3600      # tool-loop requests of one turn reuse the recall
    cache_size: 2048

  inject:
    marker: hindsight_memory     # memory goes in <hindsight_memory>...</hindsight_memory>
    header: >-
      Memory recalled from earlier work ({scope}). Use it when it is relevant.
      If it conflicts with the conversation or the code, trust the conversation and the code.

  untagged_request: passthrough  # or "reject" to require a bank tag

  # Typo guard. null = accept any value. A bank value mapped to null accepts any scope.
  allowed:
    acme: ["acme-portal", "acme-s4-extension"]
    globex: null
